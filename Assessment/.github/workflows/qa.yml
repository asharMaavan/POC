name: qa
on:
  pull_request:
  push:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      UI_BASE_URL: ${{ secrets.UI_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e .
          python -m playwright install --with-deps
          pip install pytest-html
      - name: Run E2E (Chromium)
        run: pytest -m e2e --browser chromium --html reports/pytest-e2e-report.html --self-contained-html
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: reports/

  api:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install pytest-html
      - name: Run API tests
        run: pytest -m api --html reports/pytest-api-report.html --self-contained-html
      - uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: reports/
